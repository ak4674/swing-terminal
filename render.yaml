services:
  - type: web
    name: swing-terminal
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: REFRESH_DEPLOY
        value: "1"
    healthCheckPath: /api/health
